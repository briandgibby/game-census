<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="An independent view of Steam player activity, recorded by your Game Census instance.">
  <title>{% block title %}Game Census · Steam player activity{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=profiles-2">
  <script src="{{ url_for('static', path='app.js') }}?v=profiles-2" defer></script>
</head>
<body data-refresh-seconds="{{ refresh_seconds }}">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <a class="brand" href="/" aria-label="Game Census home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Game<span class="brand-light">Census</span></span></a>
  <form class="search-form global-search" action="/search" method="get" role="search"><label class="sr-only" for="catalog-search">Search Steam game name or app ID</label><input id="catalog-search" type="search" name="q" value="{{ q|default('') }}" maxlength="100" placeholder="Search games or app ID"><button type="submit">Search</button></form>
  <nav aria-label="Main navigation">
    <a href="/" {% if nav == 'activity' %}aria-current="page"{% endif %}>Charts</a>
    <a href="/rankings" {% if nav == 'rankings' %}aria-current="page"{% endif %}>Rankings</a>
    <a href="/compare" {% if nav == 'compare' %}aria-current="page"{% endif %}>Compare</a>
    <a href="/methodology" {% if nav == 'methodology' %}aria-current="page"{% endif %}>Methodology</a>
    <a href="/status" {% if nav == 'status' %}aria-current="page"{% endif %}>Status</a>
  </nav>
</header>
<main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
<footer class="site-footer"><div><strong>Game Census</strong><span>Independent Steam statistics. Every observation has a scope.</span></div><div><a href="{{ source_url }}" rel="noreferrer">Steam data source ↗</a><a href="/api/v1/apps">Read API ↗</a></div><p>Not affiliated with Valve or SteamDB. Steam is a trademark of Valve Corporation.</p></footer>
</body>
</html>
