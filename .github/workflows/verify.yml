# Generated by python tools/sync_ci.py; pins belong to build/toolchain.lock.json.
name: Verify
on:
  push:
    branches: [develop, 'codex/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned build driver
        run: |
          python3 -m venv work/ci-runtime
          work/ci-runtime/bin/python -m pip install uv==0.11.29
          echo "$PWD/work/ci-runtime/bin" >> "$GITHUB_PATH"
      - name: Check generated inputs
        run: |
          python3 tools/sync_ci.py --check
          python3 tools/sync_toolchain.py --check
      - name: Empty setup and offline source tests
        run: |
          python3 tools/dev.py --instance ci setup --port 8000
          set -o pipefail
          python3 tools/dev.py --instance ci test | tee work/ci-tests.txt
      - name: Compare isolated release builds and installed artifacts
        run: python3 tools/repro_build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: |
            work/ci-tests.txt
            work/repro-build/*/*/*.whl
          if-no-files-found: error
          retention-days: 14
